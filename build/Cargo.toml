[package]
name = "proto-hal-build"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = { workspace = true }
derive_more.workspace = true
indexmap = { workspace = true }
heck = { workspace = true }
model = { package = "proto-hal-model", path = "../model", default-features = false }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
strsim = { version = "0.11", optional = true }
lsp-server = { version = "0.9", optional = true }
lsp-types = { version = "0.97", optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
syntax = { package = "proto-hal-syntax", path = "../syntax", optional = true }
ters = { workspace = true }

[features]
default = ["integrated"]
macros = []
integrated = []
interrupts = []
phm = ["dep:syntax", "dep:strsim"]
lsp = ["phm", "dep:lsp-server", "dep:lsp-types", "dep:serde_json", "dep:url"]

[[bin]]
name = "phm"
path = "src/bin/cli.rs"
required-features = ["phm"]
